# Builds the API's Docker image and deploys it. The deploy step is
# intentionally left as a provider-agnostic placeholder below — pick a host
# from docs/deploy/ (railway.md, render.md, fly.md, docker-vps.md, or
# generic.md for anything else) and replace it with that playbook's Deploy
# step; see docs/CI_CD.md and docs/deploy/README.md.
name: API Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t api:${{ github.sha }} apps/api
      # TODO: replace this step with your chosen host's deploy step — see docs/deploy/
      # Full steps live in the matching docs/deploy/<provider>.md:
      #   - Railway:    docs/deploy/railway.md    (railway up --service api --ci)
      #   - Render:     docs/deploy/render.md     (curl -X POST "$RENDER_DEPLOY_HOOK_URL")
      #   - Fly.io:     docs/deploy/fly.md        (flyctl deploy --config apps/api/fly.toml)
      #   - Docker/VPS: docs/deploy/docker-vps.md (push image + SSH deploy)
      #   - Other host: docs/deploy/generic.md    (the pattern for any Docker-image host)
